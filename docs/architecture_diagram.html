<style>
  :root{
    --bg:#F6F4EF;

    --ink:#20201C;

    --line:#B9B6AA;

    --blue-50:#E6F1FB;
    --blue-600:#185FA5;
    --blue-800:#0C447C;

    --gray-50:#F1EFE8;
    --gray-600:#5F5E5A;
    --gray-800:#444441;

    --green-50:#EAF3DE;
    --green-600:#3B6D11;
    --green-800:#27500A;

    --purple-50:#EEEDFE;
    --purple-600:#534AB7;
    --purple-800:#3C3489;

    --amber-50:#FAEEDA;
    --amber-600:#854F0B;
    --amber-800:#633806;
  }

  *{
    box-sizing:border-box;
  }

  body{
    margin:0;
    background:var(--bg);
    font-family:
      -apple-system,
      "Segoe UI",
      Roboto,
      "Helvetica Neue",
      Arial,
      "Noto Sans Thai",
      sans-serif;
    color:var(--ink);
    padding:32px 16px 60px;
  }

  .toolbar{
    max-width:1450px;
    margin:0 auto 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    flex-wrap:wrap;
  }

  .toolbar h1{
    font-size:18px;
    font-weight:600;
    margin:0;
  }

  .toolbar p{
    margin:2px 0 0;
    font-size:13px;
    color:var(--sub);
  }

  #downloadBtn{
    background:#20201C;
    color:#fff;
    border:none;
    padding:10px 18px;
    border-radius:8px;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:8px;
    transition:opacity .15s ease;
  }

  #downloadBtn:hover{
    opacity:.85;
  }

  #downloadBtn:active{
    opacity:.7;
  }

  #downloadBtn:disabled{
    cursor:wait;
    opacity:.6;
  }

  #downloadBtn svg{
    width:16px;
    height:16px;
  }

  #capture{
    max-width:1450px;
    margin:0 auto;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:16px;
    padding:36px;
    overflow:hidden;
  }

  #capture h2{
    text-align:center;
    font-size:20px;
    font-weight:700;
    margin:0 0 30px;
  }

  svg{
    display:block;
    width:100%;
    height:auto;
  }

  text{
    font-family:
      -apple-system,
      "Segoe UI",
      Roboto,
      "Helvetica Neue",
      Arial,
      "Noto Sans Thai",
      sans-serif;
  }

  .t14{
    font-size:14px;
  }

  .t12{
    font-size:12px;
  }

  .layer-label{
    font-size:13px;
    font-weight:700;
    letter-spacing:.02em;
  }

  .lbl-bg{
    fill:#FFFFFF;
    opacity:.96;
  }

  .connection{
    fill:none;
    stroke-width:1.5;
    stroke-linecap:round;
    stroke-linejoin:round;
  }
</style>
</head>

<script>

document
  .getElementById('downloadBtn')
  .addEventListener('click', function () {

    var target = document.getElementById('capture');
    var btn = this;

    btn.disabled = true;

    var originalLabel = btn.innerHTML;

    btn.innerHTML = 'กำลังสร้างไฟล์...';

    html2canvas(target, {
      backgroundColor: '#FFFFFF',
      scale: 2,
      useCORS: true
    })

    .then(function(canvas){

      var link = document.createElement('a');

      link.download = 'architecture-diagram.png';

      link.href = canvas.toDataURL('image/png');

      link.click();

      btn.disabled = false;
      btn.innerHTML = originalLabel;

    })

    .catch(function(err){

      console.error(err);

      btn.disabled = false;
      btn.innerHTML = originalLabel;

      alert('เกิดข้อผิดพลาดในการสร้างไฟล์ PNG');

    });

});

</script>
